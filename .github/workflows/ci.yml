name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fraud-detection

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1 — Lint & static checks
  # ════════════════════════════════════════════════════════════
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8 black isort yamllint

      - name: Lint Python — flake8
        run: |
          flake8 producer/ api-rest/ spark/ \
            --max-line-length=120 \
            --exclude=__pycache__,.git \
            --count --statistics

      - name: Format check — black
        run: |
          black --check --diff \
            producer/ api-rest/ spark/ \
            --line-length 120

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 150}}}" \
            docker-compose.yml \
            prometheus/prometheus.yml \
            prometheus/alert-rules.yml \
            grafana/provisioning/datasources/prometheus.yml \
            grafana/provisioning/dashboards/dashboard.yml

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

  # ════════════════════════════════════════════════════════════
  # JOB 2 — Build all Docker images
  # ════════════════════════════════════════════════════════════
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [api-rest, bigquery-proxy, kafka, spark, prometheus, grafana]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image — ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: fraud-detection/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

  # ════════════════════════════════════════════════════════════
  # JOB 3 — Unit tests (Python services)
  # ════════════════════════════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov \
            kafka-python pandas scikit-learn joblib numpy \
            fastapi uvicorn prometheus-client httpx requests

      - name: Run unit tests
        run: |
          pytest tests/ \
            --cov=producer \
            --cov=spark/spark_streaming_app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        continue-on-error: true   # tests folder may not exist yet

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ════════════════════════════════════════════════════════════
  # JOB 4 — Integration smoke test (docker compose up)
  # ════════════════════════════════════════════════════════════
  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy CSV (no real data needed)
        run: |
          mkdir -p data
          echo "transaction_id,user_id,amount,merchant,timestamp" > data/transactions.csv
          echo "TXN-001,USR-001,120.50,Amazon,2024-01-01T00:00:00Z"  >> data/transactions.csv
          echo "TXN-002,USR-002,9500.00,Unknown,2024-01-01T00:01:00Z" >> data/transactions.csv

      - name: Start core services only (fast smoke test)
        run: |
          docker compose up -d \
            zookeeper kafka bigquery api-rest prometheus
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Kafka..."
          timeout 120 bash -c \
            'until docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null; do sleep 5; done'

          echo "Waiting for BigQuery emulator..."
          timeout 60 bash -c \
            'until curl -sf http://localhost:9050/bigquery/v2/projects/fraud-detection-project/datasets; do sleep 3; done'

          echo "Waiting for API..."
          timeout 60 bash -c \
            'until curl -sf http://localhost:8000/health; do sleep 3; done'

      - name: Health checks
        run: |
          echo "=== API health ==="
          curl -sf http://localhost:8000/health | python3 -m json.tool

          echo "=== Prometheus health ==="
          curl -sf http://localhost:9090/-/healthy

          echo "=== Kafka topics ==="
          docker compose exec -T kafka \
            kafka-topics --bootstrap-server localhost:9092 --list

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down -v