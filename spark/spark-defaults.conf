# spark-defaults.conf — configuration globale de Spark
# Chargé automatiquement au démarrage du container

# ── Connexion Kafka ──────────────────────────────────────────────────────────
spark.kafka.bootstrap.servers=kafka:9092

# ── Connexion BigQuery ───────────────────────────────────────────────────────
spark.bigquery.project=ton-projet-gcp
spark.bigquery.dataset=fraud_detection
spark.bigquery.table=transactions

# ── Streaming config ─────────────────────────────────────────────────────────
spark.streaming.kafka.consumer.poll.ms=512
spark.sql.streaming.checkpointLocation=/tmp/spark-checkpoints

# ── Performance ──────────────────────────────────────────────────────────────
spark.executor.memory=2g
spark.driver.memory=1g
spark.executor.cores=2

# ── Métriques vers Prometheus ────────────────────────────────────────────────
spark.metrics.conf=/opt/spark/conf/metrics.properties
spark.ui.prometheus.enabled=true