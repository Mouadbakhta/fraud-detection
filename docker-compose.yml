version: '3.8'

# ============================================================
#  Détection de Fraude Bancaire en Temps Réel
#  Docker Compose — tous les services
# ============================================================

networks:
  fraud-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  spark-checkpoints:
  prometheus-data:
  grafana-data:
  bigquery-data:

# ──────────────────────────────────────────────────────────────
# SERVICE : ZOOKEEPER  (coordination Kafka)
# ──────────────────────────────────────────────────────────────
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped
    networks:
      - fraud-net
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      # JMX pour Prometheus
      KAFKA_JMX_PORT: 7072
      KAFKA_JMX_HOSTNAME: zookeeper
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ──────────────────────────────────────────────────────────────
# SERVICE : KAFKA  (message broker)
# ──────────────────────────────────────────────────────────────
  kafka:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - fraud-net
    ports:
      - "9092:9092"   # Broker
      - "9999:9999"   # JMX
      - "7071:7071"   # JMX Prometheus Exporter
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 10485760          # 10 MB
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter/kafka-config.yml
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Initialisation des topics (job one-shot)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud-net
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Création des topics Kafka...'
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:9092 \
        --topic transactions \
        --partitions 3 --replication-factor 1 \
        --config retention.ms=86400000
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:9092 \
        --topic fraud-alerts \
        --partitions 1 --replication-factor 1
      echo 'Topics créés :'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: "no"

# ──────────────────────────────────────────────────────────────
# SERVICE : KAFKA PRODUCER  (génère les transactions)
# ──────────────────────────────────────────────────────────────
  kafka-producer:
    image: python:3.11-slim
    container_name: kafka-producer
    hostname: kafka-producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - fraud-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions
      DATASET_PATH: /data/transactions.csv
      PUBLISH_RATE_MS: 100   # 10 transactions/sec
    volumes:
      - ./data:/data:ro
      - ./producer:/app
    working_dir: /app
    command: >
      bash -c "pip install kafka-python pandas --quiet && python producer.py"

# ──────────────────────────────────────────────────────────────
# SERVICE : SPARK MASTER
# ──────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    command: ["/opt/bitnami/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    networks:
      - fraud-net
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ──────────────────────────────────────────────────────────────
# SERVICE : SPARK WORKER
# ──────────────────────────────────────────────────────────────
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    command: ["/opt/bitnami/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - fraud-net
    ports:
      - "8081:8081"   # Spark Worker UI
      - "4040:4040"   # Spark App UI
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_WEBUI_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BIGQUERY_EMULATOR_HOST: bigquery:9050
      BIGQUERY_PROJECT_ID: fraud-detection-project
    volumes:
      - spark-checkpoints:/tmp/spark-checkpoints
      - ./spark/spark_streaming_app:/app
      - ./models:/app/models:ro

# ──────────────────────────────────────────────────────────────
# SERVICE : BIGQUERY EMULATOR  (stockage des transactions)
# ──────────────────────────────────────────────────────────────
  bigquery:
    build:
      context: ./bigquery-proxy
      dockerfile: Dockerfile
    container_name: bigquery
    hostname: bigquery
    restart: unless-stopped
    networks:
      - fraud-net
    ports:
      - "9050:9050"
    environment:
      BIGQUERY_PROJECT_ID: fraud-detection-project
      PORT: 9050
    volumes:
      - bigquery-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9050/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ──────────────────────────────────────────────────────────────
# SERVICE : API REST  (interrogation des résultats)
# ──────────────────────────────────────────────────────────────
  api-rest:
    build:
      context: ./api-rest
      dockerfile: Dockerfile
    container_name: api-rest
    hostname: api-rest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      bigquery:
        condition: service_healthy
    networks:
      - fraud-net
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BIGQUERY_EMULATOR_HOST: bigquery:9050
      BIGQUERY_PROJECT_ID: fraud-detection-project
      BIGQUERY_DATASET: transactions
      API_HOST: 0.0.0.0
      API_PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ──────────────────────────────────────────────────────────────
# SERVICE : PROMETHEUS  (collecte des métriques)
# ──────────────────────────────────────────────────────────────
  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    networks:
      - fraud-net
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus/data
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus/data'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ──────────────────────────────────────────────────────────────
# SERVICE : GRAFANA  (tableaux de bord)
# ──────────────────────────────────────────────────────────────
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - fraud-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fraud2024!
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

# ──────────────────────────────────────────────────────────────
# OBSERVABILITÉ : Node Exporter + cAdvisor
# ──────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - fraud-net
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    pid: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - fraud-net
    ports:
      - "9080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
