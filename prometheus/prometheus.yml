# prometheus.yml — configuration du scraping
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:7071']

  - job_name: 'spark'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['spark-master:8080']

  - job_name: 'api-rest'
    static_configs:
      - targets: ['api-rest:8000']

  - job_name: 'fraud_custom_metrics'
    static_configs:
      - targets: ['api-rest:8001']