# alert-rules.yml — règles d'alerte Prometheus
groups:
  - name: fraud_detection
    rules:

      # Latence > 1 seconde
      - alert: HighProcessingLatency
        expr: histogram_quantile(0.95, rate(processing_latency_seconds_bucket[5m])) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latence trop élevée"
          description: "P95 = {{ $value }}s"

      # Spike de fraudes
      - alert: FraudRateSpike
        expr: rate(frauds_detected_total[1m]) * 60 > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Trop de fraudes détectées"
          description: "{{ $value }} fraudes/min"

      # Kafka consumer lag
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag élevé"
          description: "Lag = {{ $value }} messages"